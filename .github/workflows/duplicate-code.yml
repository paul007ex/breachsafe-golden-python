# SPDX-License-Identifier: Apache-2.0
#
# Duplicate-code gate — fails a PR when copy-paste duplication in the tracked
# tooling code (quality-gates/) exceeds the tuned threshold,
# so shared BQP tooling does not silently accumulate clones. Token-level
# detection (jscpd) catches literal/near-literal clones across Python, shell,
# and YAML; semantic duplication (same logic, different names) is the reviewer's
# job. Config + ignore globs live in .jscpd.json.
#
# Mirrors breachsafe/qureddy's #314 jscpd gate, adapted to this repo's layout:
# there is no single src/ dir, so the three first-party code directories are
# scanned explicitly.

name: duplicate-code

on:
  pull_request:
    branches: [main]
    paths:
      # release/ and testing/ stayed in breachsafe-common at the 2026-08-23 split; only
      # quality-gates/ came here. scaffold/ is a copier TEMPLATE: its files are meant to be
      # near-identical across renders, so scanning it for duplication would be noise.
      - "quality-gates/**"
      - ".jscpd.json"
      - ".github/workflows/duplicate-code.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duplicate-code-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  jscpd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Detect duplicated code (jscpd)
        run: npx --yes jscpd@4 quality-gates/ --config .jscpd.json
