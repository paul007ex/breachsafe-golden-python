# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# Reusable "Mode B" quality-gates workflow (breachsafe-repo design §4.3).
#
# The single source of truth for the static + test + build + audit gates,
# generalized from breachsafe/qureddy's 7-phase CI. A consumer repo calls it:
#
#   jobs:
#     quality-gates:
#       uses: paul007ex/breachsafe-golden-python/.github/workflows/quality-gates-python.yml@v1
#       with:
#         module: myproject          # src/<module>, --cov=<module>
#         coverage_min: 90           # pytest --cov-fail-under
#         container_tag: 3.14-openssl3.5
#
# Everything runs inside the pinned breachsafe-container so CI stops rebuilding
# OpenSSL 3.5 and tool versions stop drifting (design §4.2). The container
# already carries: uv, ruff, mypy, bandit, pip-audit, reuse, gitleaks.
# Third-party actions are SHA-pinned; least-privilege token; no persisted creds.

name: quality-gates-python

on:
  workflow_call:
    inputs:
      module:
        description: "Import/package name under src/ (e.g. qureddy)"
        type: string
        required: true
      coverage_min:
        description: "Minimum coverage percent (pytest --cov-fail-under)"
        type: number
        required: false
        default: 90
      container_tag:
        description: "breachsafe-container tag, e.g. 3.14-openssl3.5"
        type: string
        required: true
      mocks_check:
        description: "Fail if tests use mocks/monkeypatch (default-real; opt-in until migrated)"
        type: boolean
        required: false
        default: false
      adr_check:
        description: "Fail if an implementation change cites an ADR still marked Proposed (opt-in)"
        type: boolean
        required: false
        default: false
      claude_md_check:
        description: "Fail if root CLAUDE.md lacks an Instruction-hierarchy pointer to the master or a numbered TOC (opt-in)"
        type: boolean
        required: false
        default: false
      shellcheck_check:
        description: "Run ShellCheck over **/*.sh (opt-in; not invoked unless true)"
        type: boolean
        required: false
        default: false
      hadolint_check:
        description: "Run Hadolint over **/Dockerfile* (opt-in; not invoked unless true)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ===========================================================================
  # Static analysis (no execution): lint, format, type, SAST, dep CVEs,
  # license, secrets, and the file/function/class size ceiling.
  # ===========================================================================
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/paul007ex/breachsafe-container:${{ inputs.container_tag }}
      # breachsafe-container ships USER breachsafe (uid 1000) for defence in depth.
      # The Actions runner owns /__w and /__w/_temp as uid 1001, so a uid-1000
      # container cannot write the runner file commands and every step dies with
      # EACCES on _runner_file_commands/save_state_*. Run the ephemeral CI
      # container as root; the non-root default still applies to the published
      # image and the devcontainer.
      options: --user root
    steps:
      - name: Checkout consumer repo (full history for gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gate scripts (check_size_policy.py, check_no_skipped_tests.py) live
      # in breachsafe-golden-python. Owner is always-constant and hardcoded per §4.1.
      - name: Checkout breachsafe-golden-python gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paul007ex/breachsafe-golden-python
          ref: v1
          path: .bqp-common
          persist-credentials: false

      # actions/checkout can only write inside $GITHUB_WORKSPACE, so the gate
      # scripts land in the tree the gates are about to scan. ruff, gitleaks,
      # jscpd and the rest then lint OUR files as if they were the consumer's:
      # ruff reported 39 errors against .bqp-common/quality-gates/tests/, mostly
      # S101 for asserts that belong in a test. trivy already had a skip-dirs
      # entry for this, which fixed one tool and left the others. Moving the
      # checkout out of the workspace fixes every scanner at once and cannot
      # rot the way a per-tool exclude list does.
      - name: Move gate scripts out of the scanned tree
        run: |
          set -eux
          rm -rf "$RUNNER_TEMP/bqp-common"
          mv .bqp-common "$RUNNER_TEMP/bqp-common"
          test -f "$RUNNER_TEMP/bqp-common/quality-gates/check_size_policy.py"

      # Diff-only anti-pattern gate.  It walks only added source/config lines and
      # blocks a small set of high-signal hazards.  The full catalog remains a
      # reviewer aid; this is intentionally not a regex replacement for review.
      - name: Anti-pattern diff gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail
          # The job container runs as root (see the container options above) while
          # the runner owns $GITHUB_WORKSPACE as uid 1001. git refuses to operate on
          # a repo it considers owned by someone else:
          #   fatal: detected dubious ownership in repository at '/__w/<repo>/<repo>'
          # The unit-test job already does this; the static job did not, so the
          # anti-pattern gate died with exit 128 on the first live consumer run.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git rev-parse --verify --quiet "$BASE_SHA^{commit}" >/dev/null; then
            git fetch --no-tags --depth=1 origin \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          fi
          git rev-parse --verify --quiet "$BASE_SHA^{commit}" >/dev/null || {
            echo "::error::PR base commit $BASE_SHA is unavailable after fetching $BASE_REF" >&2
            exit 2
          }
          PR_BODY="$PR_BODY" python3 "$RUNNER_TEMP"/bqp-common/quality-gates/check_antipattern_diff.py \
            --base-ref "$BASE_SHA" --head "$HEAD_SHA" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

      # Runs BEFORE `uv sync`, deliberately. That step creates .venv inside the workspace,
      # and a bare `reuse lint` then walks it and reports every installed dependency's licence
      # (0BSD, MIT, GPL-3.0-or-later, ...) as missing from the consumer's tree. The consumer
      # repo is clean; a generated environment is not theirs to annotate. This blocked the
      # first real consumer migration (#14).
      #
      # ROOT CAUSE, measured: `reuse lint` skips files git does not track, so an untracked
      # .venv is normally invisible to it. The consumer failure required .venv to be VISIBLE,
      # which happens when there is no .git directory at all:
      #
      #   with .git, .venv untracked   ->  1/1    exit 0
      #   .venv committed (tracked)    ->  13/128 exit 1
      #   no .git directory present    ->  13/128 exit 1
      #
      # The third case is what CI hit. The container shipped without git, and actions/checkout
      # SILENTLY falls back to a REST tarball when git is absent: the files arrive, no .git is
      # created, and the checkout step still reports success. breachsafe-container now ships
      # git, which removes the cause.
      #
      # This reordering is defence in depth, and correct on its own merits: ordering beats
      # excluding, because `reuse lint` takes no path arguments and `lint-file` checks only
      # per-file headers, losing the project-level checks (unused licences, bad SPDX
      # expressions). Linting a pristine checkout keeps full semantics with no exclude list to
      # maintain. reuse ships in the image, so it needs no venv.
      - name: reuse lint (before any environment is created)
        run: reuse lint

      # Default-real test rule (catalog #147): no mocks/monkeypatch in checked-in tests. Opt-in
      # (mocks_check) until a consumer has migrated its suite. A `# real-double: <reason>` marker
      # on a line exempts a genuinely-unavoidable double, paired with a real-path test.
      - name: No-mocks gate (default-real tests)
        if: ${{ inputs.mocks_check }}
        run: python3 "$RUNNER_TEMP"/bqp-common/quality-gates/check_no_mocks.py --tests-dir tests

      # Proposed-ADR gate (#4). Opt-in (adr_check), PR-only. Fails when an added source line
      # cites an ADR whose Status is still Proposed/Draft: the code lands before the decision it
      # claims to follow is ratified. A `# adr-exempt: <reason>` marker on the line waives it.
      - name: Proposed-ADR gate (opt-in; implementation must cite an Accepted ADR)
        if: ${{ inputs.adr_check && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git rev-parse --verify --quiet "$BASE_SHA^{commit}" >/dev/null; then
            git fetch --no-tags --depth=1 origin \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          fi
          git rev-parse --verify --quiet "$BASE_SHA^{commit}" >/dev/null || {
            echo "::error::PR base commit $BASE_SHA is unavailable after fetching $BASE_REF" >&2
            exit 2
          }
          python3 "$RUNNER_TEMP"/bqp-common/quality-gates/check_adr_status.py \
            --base-ref "$BASE_SHA" --head "$HEAD_SHA" --repo-root . \
            | tee -a "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

      # CLAUDE.md drift gate. Opt-in (claude_md_check); the step is not invoked otherwise.
      # Structure only: the root CLAUDE.md exists, its Instruction hierarchy section names the
      # platform master (~/claude/CLAUDE.md), and it opens with a numbered TOC (platform §9). A
      # card that restates shared rules instead of linking to the master rots out of sync; this
      # gate keeps the 1-master + thin-per-repo-card model honest.
      - name: CLAUDE.md gate (opt-in; master pointer + numbered TOC)
        if: ${{ inputs.claude_md_check }}
        run: |
          python3 "$RUNNER_TEMP"/bqp-common/quality-gates/check_claude_md.py --root .

      # ShellCheck (#5). Opt-in (shellcheck_check); the step is simply not invoked otherwise.
      # The breachsafe-container does not ship shellcheck, so the static binary is fetched into
      # $RUNNER_TEMP when absent rather than assumed on PATH.
      - name: ShellCheck (opt-in; **/*.sh)
        if: ${{ inputs.shellcheck_check }}
        run: |
          set -euo pipefail
          shellcheck_bin=shellcheck
          if ! command -v shellcheck >/dev/null 2>&1; then
            ver=v0.10.0
            url="https://github.com/koalaman/shellcheck/releases/download/${ver}/shellcheck-${ver}.linux.x86_64.tar.xz"
            curl -fsSL "$url" | tar -xJ -C "$RUNNER_TEMP"
            shellcheck_bin="$RUNNER_TEMP/shellcheck-${ver}/shellcheck"
          fi
          mapfile -t files < <(find . -type f -name '*.sh' -not -path './.git/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no *.sh files found; nothing to check"
            exit 0
          fi
          "$shellcheck_bin" "${files[@]}"

      # Hadolint (#5). Opt-in (hadolint_check); the step is simply not invoked otherwise.
      # The breachsafe-container does not ship hadolint, so the static binary is fetched into
      # $RUNNER_TEMP when absent rather than assumed on PATH.
      - name: Hadolint (opt-in; **/Dockerfile*)
        if: ${{ inputs.hadolint_check }}
        run: |
          set -euo pipefail
          hadolint_bin=hadolint
          if ! command -v hadolint >/dev/null 2>&1; then
            hadolint_bin="$RUNNER_TEMP/hadolint"
            curl -fsSL -o "$hadolint_bin" \
              https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
            chmod +x "$hadolint_bin"
          fi
          mapfile -t files < <(find . -type f -name 'Dockerfile*' -not -path './.git/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no Dockerfile* files found; nothing to check"
            exit 0
          fi
          "$hadolint_bin" "${files[@]}"

      - name: Install project (locked dev extras)
        run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run --locked ruff check .

      # TRY (tryceratops) + FBT (boolean-trap) families are ADVISORY — surfaced
      # but never block, per the tuned-MAX gate spec (design task 10).
      - name: ruff TRY/FBT families (advisory)
        continue-on-error: true
        run: uv run --locked ruff check --select TRY,FBT .

      - name: ruff format --check
        run: uv run --locked ruff format --check .

      - name: mypy --strict
        run: uv run --locked mypy "src/${{ inputs.module }}" --strict

      - name: import-linter (architecture contracts)
        run: uv run --locked lint-imports

      - name: bandit
        run: uv run --locked bandit -r -ll "src/${{ inputs.module }}"

      - name: pip-audit
        run: uv run --locked pip-audit

      - name: gitleaks full-history scan
        run: gitleaks detect --source . --redact --no-banner --log-opts="--all"

      - name: Size policy (file/function/class ceilings)
        run: |
          python3 "$RUNNER_TEMP"/bqp-common/quality-gates/check_size_policy.py \
            --src-dir "src/${{ inputs.module }}"

      - name: Python floor (>= 3.14, no 3.12/3.13 — fail-closed)
        run: |
          python3 "$RUNNER_TEMP"/bqp-common/quality-gates/check_python_floor.py \
            --pyproject pyproject.toml

      # golden-python#19 / breachsafe-common#57. Structure only, not prose: both files present,
      # each pointing at the other, the loop numbered 1..10 with no gaps, and the NOT RUN rule
      # stated. A repo may phrase its loop for its own domain; it may not ship a card whose
      # numbering skips a step, because "7/10" against a nine-step list reports nothing.
      - name: Process contract (CLAUDE.md + AGENTS.md + ten-step loop)
        run: |
          python3 "$RUNNER_TEMP"/bqp-common/quality-gates/check_process_contract.py --root .

      # =======================================================================
      # Tuned MAX code-quality gate (design task 10). Copy-paste detection,
      # cyclomatic/maintainability ceilings, dead-code + modernization, and
      # docstring coverage. jscpd / xenon / refurb / vulture / pylint-R0801 are
      # BLOCKING; interrogate is ADVISORY. diff-cover runs in the test job
      # (it needs the coverage.xml produced there).
      # =======================================================================
      - name: jscpd (copy-paste detector, <=0.5% duplication)
        # jscpd is Node-based and is installed, version-pinned, in the
        # breachsafe-container image. Running the image binary keeps this gate
        # offline and prevents npx from silently selecting another major.
        run: |
          test "$(jscpd --version)" = "cpd 5.1.1"
          jscpd --config .jscpd.json .

      - name: xenon (cyclomatic-complexity ceiling)
        run: |
          uv run --locked xenon \
            --max-absolute B --max-modules A --max-average A \
            "src/${{ inputs.module }}"

      - name: refurb (Python modernization, blocking)
        run: uv run --locked refurb "src/${{ inputs.module }}"

      - name: vulture (dead code, min-confidence 80)
        run: |
          uv run --locked vulture \
            "src/${{ inputs.module }}" .vulture-allowlist.py \
            --min-confidence 80

      - name: interrogate (docstring coverage, advisory)
        continue-on-error: true
        run: uv run --locked interrogate -v "src/${{ inputs.module }}"

      - name: pylint duplicate-code (R0801)
        run: |
          uv run --locked pylint \
            --disable=all --enable=duplicate-code \
            "src/${{ inputs.module }}"

  # ===========================================================================
  # Tests: hermetic unit + coverage floor, then the no-skipped-tests guard on
  # the emitted JUnit XML (a green pytest run that quietly skipped everything
  # must still fail — qureddy issue #15).
  # ===========================================================================
  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static
    container:
      image: ghcr.io/paul007ex/breachsafe-container:${{ inputs.container_tag }}
      # breachsafe-container ships USER breachsafe (uid 1000) for defence in depth.
      # The Actions runner owns /__w and /__w/_temp as uid 1001, so a uid-1000
      # container cannot write the runner file commands and every step dies with
      # EACCES on _runner_file_commands/save_state_*. Run the ephemeral CI
      # container as root; the non-root default still applies to the published
      # image and the devcontainer.
      options: --user root
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so diff-cover can compare changed lines against the base.
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout breachsafe-golden-python gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paul007ex/breachsafe-golden-python
          ref: v1
          path: .bqp-common
          persist-credentials: false

      # actions/checkout can only write inside $GITHUB_WORKSPACE, so the gate
      # scripts land in the tree the gates are about to scan. ruff, gitleaks,
      # jscpd and the rest then lint OUR files as if they were the consumer's:
      # ruff reported 39 errors against .bqp-common/quality-gates/tests/, mostly
      # S101 for asserts that belong in a test. trivy already had a skip-dirs
      # entry for this, which fixed one tool and left the others. Moving the
      # checkout out of the workspace fixes every scanner at once and cannot
      # rot the way a per-tool exclude list does.
      - name: Move gate scripts out of the scanned tree
        run: |
          set -eux
          rm -rf "$RUNNER_TEMP/bqp-common"
          mv .bqp-common "$RUNNER_TEMP/bqp-common"
          test -f "$RUNNER_TEMP/bqp-common/quality-gates/check_size_policy.py"

      - name: Install project (locked dev extras)
        run: uv sync --locked --extra dev

      - name: pytest (coverage floor + JUnit XML)
        run: |
          # The container runs as root while the runner owns the checkout.
          # Trust only this workspace so tests that inspect tracked files work
          # without weakening Git's dubious-ownership protection globally.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv run --locked pytest \
            --cov="${{ inputs.module }}" \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under="${{ inputs.coverage_min }}" \
            --junitxml=pytest-results.xml

      - name: No-skipped-tests guard
        if: always()
        run: |
          python3 "$RUNNER_TEMP"/bqp-common/quality-gates/check_no_skipped_tests.py \
            pytest-results.xml

      # Every changed line must be covered (design task 10). Compares the
      # coverage.xml just produced against the PR base branch. Only meaningful on
      # pull_request events, where a base ref exists.
      - name: diff-cover (100% coverage on changed lines)
        if: github.event_name == 'pull_request'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base_ref="${{ github.event.pull_request.base.ref }}"
          # The remote-tracking ref origin/<base> is not guaranteed to exist for a
          # PR checkout even at fetch-depth:0, so fetch it explicitly first. If it
          # still cannot be resolved, warn and skip rather than false-fail the gate.
          if ! git rev-parse --verify --quiet "origin/${base_ref}" >/dev/null; then
            git fetch --no-tags origin "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}" || true
          fi
          if ! git rev-parse --verify --quiet "origin/${base_ref}" >/dev/null; then
            echo "::warning::diff-cover: base ref origin/${base_ref} could not be resolved; skipping changed-line coverage check." >&2
            exit 0
          fi
          uv run --locked diff-cover coverage.xml \
            --compare-branch "origin/${base_ref}" \
            --fail-under=100

      - name: Upload coverage + JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-and-junit
          path: |
            coverage.xml
            pytest-results.xml
          if-no-files-found: error
          retention-days: 14

      # Allure results are emitted on every run (pyproject addopts --alluredir).
      # Upload them so the report is available for `allure serve`/publish each run.
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-results
          path: .allure-results
          # WARN, not error: a consumer whose pytest addopts omit --alluredir
          # produces no .allure-results, and that must not hard-fail this job.
          if-no-files-found: warn
          retention-days: 14

  # ===========================================================================
  # Build + audit: build the distribution, then scan the filesystem for
  # HIGH/CRITICAL vulnerabilities that actually fail the build.
  # ===========================================================================
  build-audit:
    name: Build + trivy audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static
    container:
      image: ghcr.io/paul007ex/breachsafe-container:${{ inputs.container_tag }}
      # breachsafe-container ships USER breachsafe (uid 1000) for defence in depth.
      # The Actions runner owns /__w and /__w/_temp as uid 1001, so a uid-1000
      # container cannot write the runner file commands and every step dies with
      # EACCES on _runner_file_commands/save_state_*. Run the ephemeral CI
      # container as root; the non-root default still applies to the published
      # image and the devcontainer.
      options: --user root
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: uv build
        run: |
          uv sync --locked --extra dev
          uv build

      - name: Upload built distribution
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # The trivy filesystem scan was removed here (lead decision, 2026-08-25):
      # Trivy no longer runs anywhere in BQP. It ran with --exit-code 0, so it
      # never failed a consumer build despite the step name claiming it did; its
      # only output was a table in the step summary that nothing consumed.
      #
      # Removing it here is also a prerequisite for dropping the trivy binary from
      # breachsafe-container. This step invoked `trivy` from the image PATH, so
      # deleting the binary first would have broken this job for every consumer.
      #
      # Vulnerability coverage that remains in this workflow: pip-audit over the
      # resolved dependency set, bandit over first-party source, and gitleaks for
      # secrets. Consumers wanting image-layer CVE scanning should run it in their
      # own image workflow, where they control the base and the suppression list.
