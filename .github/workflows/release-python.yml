# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# Reusable "Mode B" release workflow (breachsafe-repo design §4.3).
#
# The single source of truth for the fail-closed release supply chain,
# generalized from breachsafe/qureddy's release.yml + release-gate.yml. A
# consumer repo calls it from its own tiny release.yml:
#
#   on:
#     release:
#       types: [published]
#     workflow_dispatch:
#   jobs:
#     release:
#       uses: paul007ex/breachsafe-golden-python/.github/workflows/release-python.yml@v1
#       with:
#         canonical_repo: breachsafe/qureddy      # canonical-repo guard
#         python_version: "3.14"
#         testpypi_environment: testpypi
#
# Fail-closed: the canonical-repo guard and `twine check` gate the build; a
# separate verify-signing job re-reads the published Release and FAILS unless
# every asset carries a .sigstore bundle (qureddy #232 — a signing STEP
# existing does not prove it RAN). OIDC Trusted Publishing to TestPyPI means
# no API tokens live in the repo. Third-party actions are SHA-pinned.

name: release-python

on:
  workflow_call:
    inputs:
      canonical_repo:
        description: "owner/repo permitted to publish (e.g. breachsafe/qureddy)"
        type: string
        required: true
      python_version:
        description: "Python version for the release build"
        type: string
        required: false
        default: "3.14"
      testpypi_environment:
        description: "GitHub Environment matching the TestPyPI pending publisher"
        type: string
        required: false
        default: testpypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build + sign + attest
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload signed artifacts as Release assets
      id-token: write # OIDC for SLSA provenance + cosign keyless
      attestations: write # write the attestation to the repo store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail-closed guard #1: only the canonical repo may publish. GitHub
      # repo names are case-insensitive; lower-case both sides before compare.
      - name: Verify canonical release repository
        run: |
          have="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          want="$(printf '%s' "${{ inputs.canonical_repo }}" | tr '[:upper:]' '[:lower:]')"
          test "$have" = "$want" || {
            echo "refusing to publish: $GITHUB_REPOSITORY is not the canonical ${{ inputs.canonical_repo }}" >&2
            exit 1
          }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Fail-closed guard #2: lock must be current, build must succeed, and
      # twine must accept the metadata before anything is signed or uploaded.
      - name: Release gate (locked build + twine check)
        run: |
          uv lock --check
          uv tool run --from "build==1.3.0" python -m build
          uv tool run --from "twine==6.2.0" twine check dist/*

      # SLSA build provenance for the wheel + sdist. Verify later with
      # `gh attestation verify <file> --repo <canonical_repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      # Hand the pristine dist/ to the TestPyPI job BEFORE any .sigstore
      # bundle lands in dist/, so twine never tries to upload a signature.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Install cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign distributions with cosign (keyless OIDC)
        if: github.event_name == 'release'
        run: |
          for f in dist/*; do
            cosign sign-blob --yes --bundle "$f.sigstore" "$f"
          done

      - name: Upload signed distributions to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  # Fail-closed guard #3 (qureddy #232): re-read the just-published Release and
  # FAIL unless the wheel and sdist each carry a .sigstore bundle, so "the
  # signing step silently didn't run" can never ship quietly again.
  verify-signing:
    name: verify release is signed
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify the published release is actually signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          repo="${{ github.repository }}"
          assets="$(gh release view "$tag" --repo "$repo" --json assets \
            --jq '.assets[].name')"
          echo "release assets:"; echo "$assets"
          missing=0
          while IFS= read -r name; do
            case "$name" in
              *.sigstore) continue ;;
              *.whl|*.tar.gz)
                if ! printf '%s\n' "$assets" | grep -qx "$name.sigstore"; then
                  echo "MISSING signature bundle for $name" >&2
                  missing=1
                fi ;;
            esac
          done <<< "$assets"
          test "$missing" -eq 0 || {
            echo "FAIL: release $tag has unsigned distribution assets" >&2
            exit 1
          }
          echo "PASS: every distribution asset is signed."

  testpypi:
    name: publish to TestPyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.testpypi_environment }}
    permissions:
      id-token: write # OIDC — enables tokenless Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
