#
# Reusable "trust-but-verify" security-posture check (breachsafe-repo design).
#
# OpenSSF Scorecard publishes a single hosted aggregate score. This workflow does
# NOT trust that aggregate: it independently re-derives the key posture signals
# from direct `gh` probes against the calling repo, so a stale or spoofed badge
# cannot hide a regression. A consumer calls it:
#
#   jobs:
#     scorecard-verify:
#       uses: paul007ex/breachsafe-golden-python/.github/workflows/scorecard-verify.yml@v1
#
# Probes (re-derived, not read from api.securityscorecards.dev):
#   * Branch-Protection   — default branch has protection + >=1 required review
#   * Pinned-Dependencies — uv.lock committed; third-party actions are SHA-pinned
#   * SAST                — a CodeQL workflow exists
#   * Fuzzing             — a ClusterFuzzLite (cifuzz) workflow exists
#   * Token-Permissions   — every workflow declares a `permissions:` block
#
# File-presence probes fail hard; the branch-protection probe is advisory because
# reading it needs an admin-scoped token that the default GITHUB_TOKEN lacks.

name: scorecard-verify

on:
  workflow_call:
    inputs:
      default_branch:
        description: "Branch expected to carry protection (default: repo default)."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: scorecard-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Re-derive posture signals
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WANT_BRANCH: ${{ inputs.default_branch }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pinned-Dependencies — uv.lock is committed
        run: |
          if [[ ! -f uv.lock ]]; then
            echo "::error::uv.lock is missing — Scorecard Pinned-Dependencies will fail. Run 'just lock' and commit it."
            exit 1
          fi
          echo "uv.lock present."

      - name: Pinned-Dependencies — third-party actions are SHA-pinned
        run: |
          # Any `uses:` referencing a non-owned action must pin a 40-hex SHA.
          # (Reusable calls into paul007ex/breachsafe-golden-python are first-party.)
          bad=0
          while IFS= read -r line; do
            # Grab the first token after `uses:` (drops any trailing ` # vX.Y` comment)
            # and strip quotes; take everything after the last '@' as the pin.
            ref="$(printf '%s\n' "$line" | sed -E 's/.*uses:[[:space:]]*//; s/[[:space:]#].*//; s/["'\'']//g')"
            case "$ref" in
              ./*|paul007ex/*|"") continue ;;              # local or first-party
            esac
            pin="${ref##*@}"
            if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::action not SHA-pinned: $ref"
              bad=1
            fi
          done < <(grep -rhE '^[[:space:]]*(-[[:space:]]*)?uses:' .github/workflows/ || true)
          [[ "$bad" -eq 0 ]] && echo "All third-party actions are SHA-pinned."
          exit "$bad"

      - name: Token-Permissions — every workflow declares permissions
        run: |
          missing=0
          for wf in .github/workflows/*.yml .github/workflows/*.yaml; do
            [[ -e "$wf" ]] || continue
            if ! grep -qE '^\s*permissions:' "$wf"; then
              echo "::error::$wf has no top-level or job-level permissions: block"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]] && echo "All workflows declare permissions."
          exit "$missing"

      - name: SAST — a CodeQL workflow exists
        run: |
          if ! grep -rqlE 'codeql-action|github/codeql' .github/workflows/; then
            echo "::error::no CodeQL workflow found (Scorecard SAST signal)."
            exit 1
          fi
          echo "CodeQL workflow present."

      - name: Fuzzing — a ClusterFuzzLite workflow exists
        run: |
          if ! grep -rqlE 'clusterfuzzlite' .github/workflows/; then
            echo "::error::no ClusterFuzzLite workflow found (Scorecard Fuzzing signal)."
            exit 1
          fi
          echo "ClusterFuzzLite workflow present."

      - name: Branch-Protection — re-probe (advisory)
        continue-on-error: true
        run: |
          branch="$WANT_BRANCH"
          if [[ -z "$branch" ]]; then
            branch="$(gh api "repos/${REPO}" --jq .default_branch)"
          fi
          echo "Probing protection on ${REPO}@${branch} ..."
          if ! prot="$(gh api "repos/${REPO}/branches/${branch}/protection" 2>&1)"; then
            case "$prot" in
              *"Upgrade to GitHub Pro"*)
                echo "::warning::branch protection unavailable — private repo without a paid plan. Make it public or upgrade (see set_branch_protection.py)." ;;
              *"Branch not protected"*|*"Not Found"*)
                echo "::warning::branch '${branch}' is NOT protected. Run set_branch_protection.py." ;;
              *)
                echo "::warning::could not read branch protection (token scope?): ${prot}" ;;
            esac
            exit 0
          fi
          count="$(echo "$prot" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("required_pull_request_reviews",{}).get("required_approving_review_count",0))' 2>/dev/null || echo 0)"
          if [[ "${count:-0}" -lt 1 ]]; then
            echo "::warning::branch protected but requires 0 approving reviews."
          else
            echo "Branch protection OK: ${count} required review(s)."
          fi
