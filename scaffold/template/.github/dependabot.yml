#
# Dependabot configuration. Automated dependency update PRs; CI runs the full
# gate suite on each PR before merge. Reference:
# https://docs.github.com/en/code-security/dependabot
version: 2

updates:

  # ---------------------------------------------------------------------------
  # Python runtime + dev dependencies (pyproject.toml)
  # ---------------------------------------------------------------------------
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "build"
      include: scope
    groups:
      # Group dev tools so weekly updates land as one PR.
      dev-tools:
        patterns:
          - "ruff"
          - "mypy"
          - "bandit"
          - "pip-audit"
          - "reuse"
        update-types:
          - "minor"
          - "patch"
      # Group test tools.
      test-tools:
        patterns:
          - "pytest"
          - "pytest-*"
          - "hypothesis"
        update-types:
          - "minor"
          - "patch"
    # Major version bumps always get their own PR for human review.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions used in .github/workflows/
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      gha-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # Docker base images for the fuzzing harnesses (.clusterfuzzlite/Dockerfile
  # and, on Apache renders, oss-fuzz/Dockerfile). These derive FROM the
  # ClusterFuzzLite / OSS-Fuzz base images, which policy keeps on a floating
  # `latest` tag; dependabot still opens PRs for any pinned FROM refs added
  # later. A directory with no Dockerfile is simply skipped, so listing both is
  # safe on non-Apache renders where oss-fuzz/ has no Dockerfile.
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directories:
      - "/.clusterfuzzlite"
      - "/oss-fuzz"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build"
      include: scope
    groups:
      docker-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
