# GENERATED by breachsafe-repo (VERBATIM — NOT Jinja-rendered, so ${{ }} is safe).
# Owner is the constant BreachSAFE org; repo-specific values come from .github/bqp.env
# via a load-config job, injected into the reusable-workflow inputs.
name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-config:
    runs-on: ubuntu-latest
    outputs:
      module: ${{ steps.cfg.outputs.module }}
      coverage_min: ${{ steps.cfg.outputs.coverage_min }}
      container_tag: ${{ steps.cfg.outputs.container_tag }}
      docs_contract: ${{ steps.cfg.outputs.docs_contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cfg
        run: cat .github/bqp.env >> "$GITHUB_OUTPUT"

  gates:
    needs: load-config
    # Owner is a constant literal — no templating needed, so no ${{ }} collision.
    uses: paul007ex/breachsafe-golden-python/.github/workflows/quality-gates-python.yml@v1
    with:
      module: ${{ needs.load-config.outputs.module }}
      # bqp.env values arrive from $GITHUB_OUTPUT as STRINGS, and the reusable
      # workflow declares coverage_min as `type: number`. GitHub rejects the call
      # at parse time when the types disagree: the gates job never starts, the run
      # fails with no job and no annotation, and nothing says why. fromJSON casts.
      coverage_min: ${{ fromJSON(needs.load-config.outputs.coverage_min) }}
      container_tag: ${{ needs.load-config.outputs.container_tag }}
      # docs_contract is a boolean input; fromJSON casts the bqp.env string.
      docs_contract: ${{ fromJSON(needs.load-config.outputs.docs_contract) }}
    secrets: inherit
