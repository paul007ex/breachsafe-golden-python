# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
# GENERATED by breachsafe-repo (VERBATIM — NOT Jinja-rendered, so ${{ }} is safe).
#
# ClusterFuzzLite short fuzz run on pull requests.
#
# Builds the Atheris harnesses under tests/fuzz/ in the OSS-Fuzz Python base
# image (see .clusterfuzzlite/) and fuzzes only the code paths touched by the PR
# for a short, bounded time. This is the self-hosted, no-acceptance-process
# fuzzing tier that runs in EVERY repo (Apache or PolyForm) and provides the
# OpenSSF Scorecard "Fuzzing" signal. Apache/OSS repos additionally onboard to
# hosted continuous Google OSS-Fuzz via oss-fuzz/ (see oss-fuzz/README.md).
#
# atheris ships amd64-Linux wheels ONLY, so the fuzz job must run on an amd64
# runner (ubuntu-latest is amd64). Advisory (continue-on-error): fuzzing must
# surface findings without blocking PRs.
#
# Reference: https://google.github.io/clusterfuzzlite/
name: CIFuzz

on:
  pull_request:
    # Only run when source, the harnesses, or the fuzzing setup change.
    paths:
      - "src/**"
      - "tests/fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cifuzz.yml"

# Deny all scopes by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: cifuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzzing:
    name: ClusterFuzzLite PR fuzzing
    # amd64 runner (atheris publishes amd64-Linux wheels only).
    runs-on: ubuntu-latest
    # Advisory until the harness build stabilizes; must not block PRs.
    continue-on-error: true
    permissions:
      contents: read  # build_fuzzers checks out the PR head
    steps:
      - name: Build fuzzers
        id: build
        # ClusterFuzzLite publishes no tags; pinned to a full commit SHA.
        uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c
        with:
          language: python
          sanitizer: address

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Short, bounded run so the PR gate stays fast.
          fuzz-seconds: 120
          mode: "code-change"
          sanitizer: "address"
          output-sarif: false
