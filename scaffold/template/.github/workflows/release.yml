# GENERATED by breachsafe-repo (VERBATIM — NOT Jinja-rendered, so ${{ }} is safe).
# Release runs the fail-closed reusable release workflow in breachsafe-golden-python:
# gate -> OIDC publish -> cosign keyless signing -> SLSA provenance attestation.
# Repo-specific values come from .github/bqp.env via a load-config job.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load-config:
    runs-on: ubuntu-latest
    outputs:
      module: ${{ steps.cfg.outputs.module }}
      coverage_min: ${{ steps.cfg.outputs.coverage_min }}
      container_tag: ${{ steps.cfg.outputs.container_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cfg
        run: cat .github/bqp.env >> "$GITHUB_OUTPUT"

  release:
    needs: load-config
    # Owner is a constant literal — no templating needed, so no ${{ }} collision.
    uses: paul007ex/breachsafe-golden-python/.github/workflows/release-python.yml@v1
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # OIDC for Trusted Publishing + cosign keyless
      attestations: write  # SLSA provenance attestation
    with:
      module: ${{ needs.load-config.outputs.module }}
      coverage_min: ${{ needs.load-config.outputs.coverage_min }}
      container_tag: ${{ needs.load-config.outputs.container_tag }}
    secrets: inherit
