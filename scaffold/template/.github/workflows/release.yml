# GENERATED by breachsafe-repo (VERBATIM — NOT Jinja-rendered, so ${{ }} is safe).
# Release calls the fail-closed reusable release workflow in breachsafe-golden-python:
# gate -> OIDC publish -> cosign keyless signing -> SLSA attestation -> cryptographic
# verify-signing. That reusable workflow gates its sign/upload/verify jobs on a
# `release` event and reads github.event.release.tag_name, so this MUST trigger on a
# published Release (not a bare tag push) and pass canonical_repo.
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: paul007ex/breachsafe-golden-python/.github/workflows/release-python.yml@v1
    permissions:
      contents: write      # create/upload the GitHub Release
      id-token: write      # OIDC for Trusted Publishing + cosign keyless
      attestations: write  # SLSA provenance attestation
    with:
      canonical_repo: ${{ github.repository }}
    secrets: inherit
